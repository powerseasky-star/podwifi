# iOS 云端编译流水线（GitHub Actions）—— v2 / 2026-11-02
#
# v1 → v2 的唯一改动：**删掉 push.paths 过滤器**。
#   原因（2026-11-02 实测）：v1 用 paths 白名单（PodWifi/**、project.yml、workflow 自身），
#   而那次推送的 HEAD 提交只改了 .gitattributes → 不匹配任何一条 → GitHub 判定"无需运行"：
#   workflow 被识别为 active，却 0 次运行（pushed_at 与 workflow created_at 同一秒，排除延迟）。
#   过滤器省的是额度，毁的是"推了却不跑"的确定性；这里宁可每次都跑，靠 concurrency 去重。
#   旧版已快照到 backups/ios-build_v1_20261101_带paths过滤.yml
#
# 产出：未签名的 PodWifi-unsigned.ipa
# 装机：在 Windows 上用 Sideloadly / AltStore，用你自己的 Apple ID 自签后装到 iPhone
#       （免费 Apple ID 的签名 7 天过期，到期重签即可；付费开发者账号 1 年）
#
# ⚠️ 重要：private 仓库跑 macOS runner 会按 **10 倍** 计额度，且 GitHub 要求账号已绑定支付方式；
#          public 仓库的 macOS runner **完全免费且不限量**。
#
# 触发方式：push 到 main，或在 Actions 页面点 "Run workflow"

name: ios-build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# 同一分支只保留最新一次运行，避免连续 push 烧额度
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 自带 Xcode 16.x；若将来被弃用，改成 macos-latest 即可
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # v0.4.0：whisper.cpp 用官方预编译 XCFramework（不用自己编），构建期取到 Vendor/
      # 仓库里不存这 20MB+ 二进制；压缩包内部层级随版本可能变化，所以用 find 定位
      - name: Fetch whisper.xcframework
        run: |
          set -euo pipefail
          mkdir -p Vendor
          curl -fL --retry 3 --retry-delay 2 -o /tmp/whisper.zip \
            "https://github.com/ggml-org/whisper.cpp/releases/download/v1.7.5/whisper-v1.7.5-xcframework.zip"
          ls -lh /tmp/whisper.zip
          shasum -a 256 /tmp/whisper.zip
          unzip -q /tmp/whisper.zip -d /tmp/whisper
          XC=$(find /tmp/whisper -maxdepth 4 -name "whisper.xcframework" -type d | head -1)
          if [ -z "$XC" ]; then
            echo "::error::压缩包里找不到 whisper.xcframework"
            find /tmp/whisper -maxdepth 3 | head -40
            exit 1
          fi
          echo "found: $XC"
          rm -rf Vendor/whisper.xcframework
          cp -R "$XC" Vendor/
          echo "--- Vendor 内容 ---"
          ls -la Vendor
          echo "--- 内部结构 ---"
          find Vendor/whisper.xcframework -maxdepth 3 | head -40

      # v0.5.0：ncnn 必须**关掉 OpenMP** 自己编。
      #   实测证据（build 9 链接日志）：官方 ncnn-*-ios.zip 是开 OpenMP 编译的，
      #   引用 ___kmpc_for_static_init_4 等 libomp 符号；iOS 设备没有 libomp →
      #   ld: Undefined symbols for architecture arm64，链接必失败。
      #   用 CMake 原生 iOS 支持交叉编译，产物规整到 Vendor/ncnn/{include,lib}。
      - name: Restore ncnn cache
        id: ncnn-cache
        uses: actions/cache@v4
        with:
          path: Vendor/ncnn
          key: ncnn-20260113-noomp-v1

      - name: Build ncnn (iOS arm64, OpenMP OFF)
        if: steps.ncnn-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p Vendor/ncnn/include/ncnn Vendor/ncnn/lib
          curl -fL --retry 3 -o /tmp/ncnn-src.zip \
            "https://github.com/Tencent/ncnn/archive/refs/tags/20260113.zip"
          unzip -q /tmp/ncnn-src.zip -d /tmp
          SRC=$(ls -d /tmp/ncnn-20260113 | head -1)
          echo "源码: $SRC"
          cmake -S "$SRC" -B /tmp/bn \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DNCNN_OPENMP=OFF \
            -DNCNN_VULKAN=OFF \
            -DNCNN_SHARED_LIB=OFF \
            -DNCNN_BUILD_TESTS=OFF \
            -DNCNN_BUILD_BENCHMARK=OFF \
            -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_TOOLS=OFF \
            -DNCNN_PIXEL=ON
          cmake --build /tmp/bn -j 4
          LIB=$(find /tmp/bn -name "libncnn.a" | head -1)
          if [ -z "$LIB" ]; then echo "::error::没生成 libncnn.a"; exit 1; fi
          cp "$LIB" Vendor/ncnn/lib/libncnn.a
          cp "$SRC"/src/*.h Vendor/ncnn/include/ncnn/
          cp /tmp/bn/src/*.h Vendor/ncnn/include/ncnn/ 2>/dev/null || true
          echo "--- 产物 ---"
          ls -lh Vendor/ncnn/lib
          ls Vendor/ncnn/include/ncnn | head -12
          # 确认没有 OpenMP 依赖（应为空）
          if nm -u Vendor/ncnn/lib/libncnn.a 2>/dev/null | grep -q "__kmpc"; then
            echo "::error::libncnn.a 仍引用 OpenMP 符号"
            exit 1
          fi
          echo "✅ 无 OpenMP 依赖"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PodWifi.xcodeproj \
            -scheme PodWifi \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Verify .app exists
        run: |
          APP="build/Build/Products/Release-iphoneos/PodWifi.app"
          if [ ! -d "$APP" ]; then
            echo "::error::未生成 PodWifi.app，构建失败"
            exit 1
          fi
          ls -la "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

      - name: Package unsigned ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/PodWifi.app out/Payload/
          cd out
          zip -qry PodWifi-unsigned.ipa Payload
          ls -lh PodWifi-unsigned.ipa
          shasum -a 256 PodWifi-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodWifi-ipa
          path: out/PodWifi-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

name: PodWifi
options:
  bundleIdPrefix: com.mars
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  PodWifi:
    type: application
    platform: iOS
    sources:
      - path: PodWifi
        excludes:
          - "Models/**"
      # YOLO 妯″瀷锛?.9MB锛夋樉寮忎綔涓鸿祫婧愭墦鍖咃紝閬垮厤琚綋鎴愭湭鐭ョ被鍨嬫紡鎺?      - path: PodWifi/Models
        buildPhase: resources
    # 涓や釜浜岃繘鍒朵緷璧栭兘鐢?CI 鍦ㄦ瀯寤哄墠鍙栧埌 Vendor/锛堜粨搴撲笉瀛?20MB+ 浜岃繘鍒讹級
    #  馃敶 whisper 蹇呴』 embed锛氬疄娴嬫槸鍔ㄦ€佸簱锛園rpath/whisper.framework/whisper锛夛紝
    #     embed=false 鏃?Frameworks/ 涓嶈繘 app锛岀湡鏈哄惎鍔ㄥ嵆 dyld 闂€€銆?    dependencies:
      - framework: Vendor/whisper.xcframework
        embed: true
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mars.podwifi
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "11"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PodWifi/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        # Swift 璋冪敤 ObjC++锛圥odWhisper / PodYolo / PodDepth锛夐渶瑕佹ˉ鎺ュご
        SWIFT_OBJC_BRIDGING_HEADER: PodWifi/PodWifi-Bridging-Header.h
        # whisper.cpp 涓?ncnn 閮芥槸 C++锛屽繀椤绘樉寮忛摼 libc++
        OTHER_LDFLAGS: "$(inherited) -lc++ -lncnn"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        # ncnn 闈欐€佸簱涓庡ご鏂囦欢鐢?CI 瑙勬暣鍒板浐瀹氫綅缃紱whisper 鐨勪袱绉嶅彲鑳藉竷灞€涔熶竴骞剁粰鍑?        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/ncnn/include $(SRCROOT)/Vendor/ncnn/include/ncnn $(SRCROOT)/Vendor/whisper.xcframework/ios-arm64/Headers $(SRCROOT)/Vendor/whisper.xcframework/ios-arm64/whisper.framework/Headers"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/ncnn/lib"

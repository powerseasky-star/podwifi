name: PodWifi
options:
  bundleIdPrefix: com.mars
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  PodWifi:
    type: application
    platform: iOS
    sources:
      - path: PodWifi
    # whisper.xcframework 由 CI 在构建前下载到 Vendor/（仓库不存 20MB+ 二进制）
    # 🔴 embed 必须 true：实测 ipa 二进制里是 @rpath/whisper.framework/whisper（动态库），
    #    embed=false 时 Frameworks/ 不会被打进 app，装机后启动即 dyld "Library not loaded" 闪退。
    dependencies:
      - framework: Vendor/whisper.xcframework
        embed: true
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mars.podwifi
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PodWifi/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        # Swift 调用 PodWhisper（Objective-C++）需要桥接头
        SWIFT_OBJC_BRIDGING_HEADER: PodWifi/PodWifi-Bridging-Header.h
        # whisper.cpp 是 C++，必须显式链 libc++
        OTHER_LDFLAGS: "$(inherited) -lc++"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        # 防御性写法：xcframework 内可能是 framework 包装，也可能只有 libxxx.a + Headers/。
        # 两种布局都给出搜索路径（不存在的路径无害），避免因布局差异白白浪费一轮云端构建。
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/whisper.xcframework/ios-arm64/Headers $(SRCROOT)/Vendor/whisper.xcframework/ios-arm64/whisper.framework/Headers"

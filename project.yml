name: PodWifi
options:
  bundleIdPrefix: com.mars
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  PodWifi:
    type: application
    platform: iOS
    sources:
      - path: PodWifi
        excludes:
          - "Models/**"
      # YOLO 模型（4.9MB）显式作为资源打包，避免被当成未知类型漏掉
      - path: PodWifi/Models
        buildPhase: resources
    # 两个二进制依赖都由 CI 在构建前取到 Vendor/（仓库不存 20MB+ 二进制）
    #  🔴 whisper 必须 embed：实测是动态库（@rpath/whisper.framework/whisper），
    #     embed=false 时 Frameworks/ 不进 app，真机启动即 dyld 闪退。
    dependencies:
      - framework: Vendor/whisper.xcframework
        embed: true
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mars.podwifi
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "8"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PodWifi/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        # Swift 调用 ObjC++（PodWhisper / PodYolo / PodDepth）需要桥接头
        SWIFT_OBJC_BRIDGING_HEADER: PodWifi/PodWifi-Bridging-Header.h
        # whisper.cpp 与 ncnn 都是 C++，必须显式链 libc++
        OTHER_LDFLAGS: "$(inherited) -lc++ -lncnn"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        # ncnn 静态库与头文件由 CI 规整到固定位置；whisper 的两种可能布局也一并给出
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/ncnn/include $(SRCROOT)/Vendor/whisper.xcframework/ios-arm64/Headers $(SRCROOT)/Vendor/whisper.xcframework/ios-arm64/whisper.framework/Headers"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/ncnn/lib"
